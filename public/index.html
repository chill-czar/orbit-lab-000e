<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, modern, and powerful HTML calculator with memory, history, and keyboard shortcuts.">
  <title>Modern Web Calculator</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="calculator-app">
    <div class="calculator-card" id="calculatorCard">
      <!-- Calculator Header -->
      <header class="calc-header">
        <div class="header-left">
          <div class="app-brand">
            <span class="brand-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                <line x1="8" y1="6" x2="16" y2="6"></line>
                <line x1="16" y1="14" x2="16" y2="18"></line>
                <path d="M16 10h.01"></path>
                <path d="M12 10h.01"></path>
                <path d="M8 10h.01"></path>
                <path d="M12 14h.01"></path>
                <path d="M8 14h.01"></path>
                <path d="M12 18h.01"></path>
                <path d="M8 18h.01"></path>
              </svg>
            </span>
            <span class="brand-title">CalcPro</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="scientificToggleBtn" title="Toggle scientific functions" aria-label="Toggle scientific functions">
            <span class="btn-text-badge">fx</span>
          </button>
          <button class="icon-btn" id="themeToggleBtn" title="Toggle dark/light theme" aria-label="Toggle theme">
            <svg id="themeIconSun" class="theme-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button class="icon-btn" id="historyToggleBtn" title="View calculation history" aria-label="Toggle history">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="history-badge hidden" id="historyCountBadge">0</span>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <section class="display-container" aria-label="Calculator display">
        <div class="display-meta">
          <span class="memory-badge hidden" id="memoryIndicator">MEM: <span id="memoryValue">0</span></span>
          <span class="calc-mode-indicator" id="modeIndicator">STD</span>
        </div>

        <div class="display-history" id="displayHistory" title="Current expression"></div>

        <div class="display-main">
          <div class="display-value" id="displayMain" role="region" aria-live="polite">0</div>
          <button class="copy-btn" id="copyBtn" title="Copy result to clipboard" aria-label="Copy to clipboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </section>

      <!-- Memory Function Row -->
      <div class="keypad-memory-row">
        <button class="btn btn-memory" data-action="mc" title="Memory Clear (MC)">MC</button>
        <button class="btn btn-memory" data-action="mr" title="Memory Recall (MR)">MR</button>
        <button class="btn btn-memory" data-action="m-plus" title="Memory Add (M+)">M+</button>
        <button class="btn btn-memory" data-action="m-minus" title="Memory Subtract (M-)">M−</button>
        <button class="btn btn-memory" data-action="ms" title="Memory Store (MS)">MS</button>
      </div>

      <!-- Scientific Functions Row (Collapsible) -->
      <div class="keypad-scientific-row hidden" id="scientificPanel">
        <button class="btn btn-scientific" data-action="paren-open">(</button>
        <button class="btn btn-scientific" data-action="paren-close">)</button>
        <button class="btn btn-scientific" data-action="square" title="Square (x²)">x²</button>
        <button class="btn btn-scientific" data-action="sqrt" title="Square root (√x)">√x</button>
        <button class="btn btn-scientific" data-action="reciprocal" title="Reciprocal (1/x)">1/x</button>
        <button class="btn btn-scientific" data-action="pi" title="Pi (π)">π</button>
      </div>

      <!-- Standard Keypad -->
      <div class="keypad-grid">
        <button class="btn btn-function" data-action="clear-all" id="btnClearAll" title="Clear all (Escape)">AC</button>
        <button class="btn btn-function" data-action="clear-entry" title="Clear entry">CE</button>
        <button class="btn btn-function" data-action="backspace" title="Backspace (⌫)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="btn btn-operator" data-action="operator" data-value="/" title="Divide (÷)">÷</button>

        <button class="btn btn-number" data-value="7">7</button>
        <button class="btn btn-number" data-value="8">8</button>
        <button class="btn btn-number" data-value="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*" title="Multiply (×)">×</button>

        <button class="btn btn-number" data-value="4">4</button>
        <button class="btn btn-number" data-value="5">5</button>
        <button class="btn btn-number" data-value="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-" title="Subtract (−)">−</button>

        <button class="btn btn-number" data-value="1">1</button>
        <button class="btn btn-number" data-value="2">2</button>
        <button class="btn btn-number" data-value="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+" title="Add (+)">+</button>

        <button class="btn btn-function" data-action="negate" title="Positive/Negative (±)">±</button>
        <button class="btn btn-number" data-value="0">0</button>
        <button class="btn btn-number" data-action="decimal" data-value=".">.</button>
        <button class="btn btn-equals" data-action="calculate" title="Calculate (=)">=</button>
      </div>

      <!-- Footer Hints -->
      <footer class="calc-footer">
        <span>Keyboard friendly &bull; Press <kbd>=</kbd> or <kbd>Enter</kbd> to calculate</span>
      </footer>
    </div>

    <!-- History Drawer Sidebar -->
    <aside class="history-drawer" id="historyDrawer" aria-label="Calculation History">
      <div class="history-header">
        <h3>History</h3>
        <div class="history-header-actions">
          <button class="history-clear-btn" id="historyClearBtn" title="Clear all history">Clear</button>
          <button class="icon-btn" id="historyCloseBtn" title="Close history" aria-label="Close history">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <p>No calculations yet</p>
          <span class="subtext">Your calculation history will appear here</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container" id="toast" role="status" aria-live="polite"></div>

  <script src="/calculator.js"></script>
</body>
</html>
